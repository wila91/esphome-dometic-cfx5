  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: dometic_cfx_ble1
    type: COMPARTMENT_0_MEASURED_TEMPERATURE
    name: "CFX5 Actual Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: mdi:thermometer

  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: dometic_cfx_ble1
    type: BATTERY_VOLTAGE_LEVEL
    name: "CFX5 Supply Voltage"
    id: cfx_spannung
    unit_of_measurement: "V"
    accuracy_decimals: 3
    icon: mdi:car-battery
  
  - platform: ble_client
    ble_client_id: cfx_ble_client
    name: "CFX5 BLE Signal Strength"
    type: rssi
    unit_of_measurement: "dBm"
    icon: mdi:bluetooth-connect 
        
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: dometic_cfx_ble1
    type: BATTERY_PROTECTION_LEVEL
    name: "CFX5 Battery Protection Raw"
    icon: mdi:battery-check-outline
    id: cfx_battery_protection_raw
    internal: true # Hides the raw '0/1/2' number from HA
    
climate:
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: dometic_cfx_ble1
    name: "CFX5 Fridge"

binary_sensor:
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: dometic_cfx_ble1
    type: COMPARTMENT_0_DOOR_OPEN
    name: "CFX5 Door Open"
    device_class: door
    icon: mdi:door-open

  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: dometic_cfx_ble1
    type: DOOR_ALERT
    name: "CFX Door Alarm"
    device_class: problem
    icon: mdi:alarm-light

text_sensor:
  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: dometic_cfx_ble1
    type: FIRMWARE_VERSION
    name: "CFX5 Firmware"
    icon: mdi:chip

  - platform: dometic_cfx_ble
    dometic_cfx_ble_id: dometic_cfx_ble1
    type: POWER_SOURCE
    name: "CFX5 Power Source"
    icon: mdi:power-plug

  - platform: template
    name: "CFX Battery Protection"
    icon: mdi:battery-check-outline
    lambda: |-
      if (id(cfx_battery_protection_raw).state == 0.0) {
        return {"Low"};
      } else if (id(cfx_battery_protection_raw).state == 1.0) {
        return {"Medium"};
      } else if (id(cfx_battery_protection_raw).state == 2.0) {
        return {"High"};
      } else {
        return {"Unknown"};
      }
  #  update_interval: 15s
