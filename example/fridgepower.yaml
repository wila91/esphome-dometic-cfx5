#      unit_of_measurement: A
#    update_interval: 5s

#  - platform: template
#    name: "Fridge Power"
#    unit_of_measurement: W
#    device_class: power
#    state_class: measurement
#    accuracy_decimals: 1
#    lambda: |-
#      float v = id(cfx_spannung).state;
#      float i = id(cfx_strom).state;
#      if (!isnan(v) && !isnan(i) && v > 0) {
#        return v * i;
#      }
#      if (!isnan(i)) {
#        return 12.0f * i;  // fallback to 12V nominal
