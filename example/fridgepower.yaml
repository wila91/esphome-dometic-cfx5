esphome:
  name: fridgepower
  friendly_name: FridgePower

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

safe_mode:
  boot_is_good_after: 120s

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
 # power_save_mode: none

#web_server:
#  version: 3

external_components:
  - source: github://wila91/esphome-dometic-cfx5
    components: [dometic_cfx_ble]

# Optional: INA226 current sensor on the 12V supply line
#i2c:
#  sda: GPIO4
#  scl: GPIO5
#  scan: true
#  frequency: 10000 Hz

esp32_ble_tracker:
  scan_parameters:
    interval: 1200ms
    window: 120ms
    active: false
    duration: 30s

ble_client:
  - mac_address: XX:XX:XX:XX:XX:XX  # <-- replace with your CFX5 MAC
    id: cfx_ble_client
    auto_connect: true
    on_connect:
      then:
        - lambda: |-
            esp_ble_set_encryption(id(cfx_ble_client).get_remote_bda(), ESP_BLE_SEC_ENCRYPT_NO_MITM);

dometic_cfx_ble:
  id: dometic_cfx_ble1
  ble_client_id: cfx_ble_client
  product_type: SZ

button:
  - platform: template
    name: "CFX5 Re-Pair"
    icon: mdi:bluetooth-connect
    on_press:
      - lambda: |-
          esp_ble_remove_bond_device(id(cfx_ble_client).get_remote_bda());
      - delay: 500ms
      - lambda: |-
          App.safe_reboot();

sensor:
  # INA226 current sensor (optional, remove if not present)
#  - platform: ina226
#    address: 0x40
#    shunt_resistance: 0.002 ohm
#    current:
#      name: "Fridge Current"
